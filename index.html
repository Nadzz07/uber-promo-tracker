<!DOCTYPE html>
<html>
<head>
    <title>Uber Promo Tracker</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 40px 20px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 35px;
        }

        .promo-card {
            background: #1c1c1c;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .promo-card h2 {
            margin-top: 0;
        }

        .discount {
            font-size: 30px;
            font-weight: bold;
            color: #4ade80;
        }

        button {
            background: white;
            color: black;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ddd;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Uber Promo Tracker</h1>

        <p class="subtitle">
            Find and track your best Uber promotions.
        </p>

        <div class="promo-card">

            <h2>Current Best Promo</h2>

            <p class="discount">
                40% OFF
            </p>

            <p>
                Up to £10 off your next ride.
            </p>

            <button>
                View Promo
            </button>

        </div>

    </div>

</body>
</html>
