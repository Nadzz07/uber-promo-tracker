name: Deploy tracker to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      private_data_verified:
        description: "Real Mac receipt validation passed for this main snapshot (see RELEASE.md)"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: tracker-pages
  cancel-in-progress: false
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run validate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
      - name: Require regenerated account policy before deployment
        if: github.event_name == 'workflow_dispatch' && inputs.private_data_verified
        run: node --input-type=module -e "import fs from 'node:fs'; if(JSON.parse(fs.readFileSync('promos.json')).summary?.accountStatusVersion !== 2) throw new Error('Regenerate and validate public data on the Mac before deploying');"
      - uses: actions/configure-pages@v5
        if: github.event_name == 'workflow_dispatch' && inputs.private_data_verified
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.private_data_verified
        with:
          path: dist
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.private_data_verified && github.ref == 'refs/heads/main'
    needs: validate-and-build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy validated site
        id: deployment
        uses: actions/deploy-pages@v4
