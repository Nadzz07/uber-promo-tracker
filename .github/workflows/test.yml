name: Test promo engine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install pinned build tools
        run: npm ci --ignore-scripts
      - name: Run regression, integration, privacy and syntax checks
        run: npm run validate
      - name: Build allowlisted public site
        run: npm run build
  browser:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    runs-on: ubuntu-latest
    # The 21-program suite includes three-theme screen/contrast checks.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Use Ubuntu primary package mirror
        run: |
          # Hosted runners also route through this mirror+file URI; changing
          # only a literal Azure URL leaves that indirection untouched.
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ]; then
              sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu/|g; s|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser
        env:
          TRACKER_BROWSER_ENGINE: ${{ matrix.browser }}
